<header class="top-nav" [class.top-nav--open]="drawerVisible()">

  <!-- Brand ──────────────────────────────────────────────────────────────── -->
  <button class="top-nav__brand" type="button" (click)="scrollToTop()">
    {{ brandName }}
  </button>

  <!-- Desktop links (always in DOM; collapsed to width:0 in hamburger mode) -->
  <nav aria-label="Main navigation" [class.top-nav__nav--hidden]="useHamburger()">
    <ul class="top-nav__list" #navList>
      @for (section of sections; track section.id) {
        <li>
          <button
            type="button"
            class="top-nav__link"
            [class.top-nav__link--active]="activeSectionId === section.id"
            (click)="scrollTo(section.id)"
          >{{ section.label }}</button>
        </li>
      }
    </ul>
  </nav>

  <!-- Right controls ───────────────────────────────────────────────────── -->
  <div class="top-nav__controls">
    <app-theme-toggle />

    @if (useHamburger()) {
      <button
        class="top-nav__hamburger"
        [class.top-nav__hamburger--open]="menuOpen()"
        type="button"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Toggle navigation menu"
        (click)="$event.stopPropagation(); toggleMenu()"
      >
        <span class="top-nav__bar"></span>
        <span class="top-nav__bar"></span>
        <span class="top-nav__bar"></span>
      </button>
    }
  </div>

  <!-- Drawer (kept in DOM during close animation via drawerVisible) ──────── -->
  @if (drawerVisible()) {
    <div
      class="top-nav__drawer"
      [class.top-nav__drawer--closing]="drawerClosing()"
      (click)="$event.stopPropagation()"
    >
      <ul class="top-nav__drawer-list">
        @for (section of sections; track section.id) {
          <li>
            <button
              type="button"
              class="top-nav__drawer-link"
              [class.top-nav__drawer-link--active]="activeSectionId === section.id"
              (click)="scrollTo(section.id)"
            >{{ section.label }}</button>
          </li>
        }
      </ul>
    </div>
  }

</header>
