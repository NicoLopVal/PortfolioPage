<section id="reference" class="section section--dark reference">
  <app-section-header title="Reference" watermarkLetter="R" />
  <div class="reference__cards">
    <app-recommendation-card
      [name]="testimonial.authorName"
      [role]="testimonial.authorTitle"
      [quote]="testimonial.quote"
      [avatarSrc]="testimonial.authorImage"
      [linkedInUrl]="testimonial.linkedInUrl"
    />
  </div>
</section>
