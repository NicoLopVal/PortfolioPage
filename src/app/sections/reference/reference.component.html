<section id="reference" class="section section--dark reference">
  <app-section-header title="Reference" watermarkLetter="R" />
  <article class="reference__card">
    <img [src]="testimonial.authorImage" [alt]="testimonial.authorName" class="reference__avatar" />
    <div class="reference__content">
      <blockquote>{{ testimonial.quote }}</blockquote>
      <footer>
        <strong>{{ testimonial.authorName }}</strong>
        <span>{{ testimonial.authorTitle }}</span>
      </footer>
    </div>
  </article>
</section>
