<section id="portfolio" class="section section--dark portfolio-gallery">
  <app-section-header title="My Portfolio" watermarkLetter="M" />
  <div class="portfolio-gallery__grid">
    @for (item of data.portfolio; track item.id) {
      <article
        class="portfolio-gallery__item portfolio-gallery__item--{{ item.size }} portfolio-gallery__item--clickable"
        role="button"
        tabindex="0"
        [attr.aria-label]="'View details for ' + item.tileTitle"
        (click)="open(item)"
        (keydown.enter)="open(item)"
        (keydown.space)="$event.preventDefault(); open(item)"
      >
        <img [src]="item.image" [alt]="item.tileTitle" loading="lazy" />
        <div class="portfolio-gallery__overlay" appFitOverlay>
          <div class="portfolio-gallery__overlay-content">
            <h3 class="portfolio-gallery__overlay-title">{{ item.tileTitle }}</h3>
            <p class="portfolio-gallery__overlay-tagline">{{ item.tagline }}</p>
            <ul class="portfolio-gallery__badges">
              @for (badge of item.techBadges; track badge) {
                <li>{{ badge }}</li>
              }
            </ul>
          </div>
        </div>
      </article>
    }
  </div>
</section>
