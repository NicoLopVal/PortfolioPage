<section id="about" class="section section--dark about">
  <app-section-header title="About Me" watermarkLetter="A" />
  <div class="about__grid">
    <div class="about__image-wrap">
      <img [src]="data.profile.aboutImage" alt="About portrait" class="about__image" />
    </div>
    <div class="about__text">
      <h3 class="about__heading">{{ data.profile.aboutTitle }}</h3>
      @for (paragraph of data.profile.aboutParagraphs; track $index) {
        <p>{{ paragraph }}</p>
      }
    </div>
  </div>
</section>
