<section id="education" class="section section--dark education">
  <app-section-header title="Education" watermarkLetter="E" />
  <div class="timeline-cards" appReveal="stagger">
    @for (item of data.education; track item.id) {
      <article class="timeline-card">
        <div
          class="timeline-card__bar"
          [class.timeline-card__bar--accent]="item.accentBar"
        >
          <span>{{ item.period }}</span>
        </div>
        <div class="timeline-card__body">
          <div class="timeline-card__header">
            <a
              class="timeline-card__logo-link"
              [href]="item.instituteLinkedIn"
              target="_blank"
              rel="noopener noreferrer"
              [attr.aria-label]="item.institution + ' on LinkedIn'"
              tabindex="-1"
              aria-hidden="true"
            >
              <img
                class="timeline-card__logo"
                [src]="item.issuerLogo"
                [alt]="item.institution + ' logo'"
                width="48"
                height="48"
                loading="lazy"
              />
            </a>
            <div class="timeline-card__content">
              @if (item.certificateUrl) {
                <h3>
                  <a
                    [href]="item.certificateUrl"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    {{ item.degree }}
                  </a>
                </h3>
              } @else {
                <h3>{{ item.degree }}</h3>
              }
              <a
                class="timeline-card__institution-link"
                [href]="item.instituteLinkedIn"
                target="_blank"
                rel="noopener noreferrer"
              >
                {{ item.institution }}
              </a>
            </div>
          </div>
        </div>
      </article>
    }
  </div>
</section>
