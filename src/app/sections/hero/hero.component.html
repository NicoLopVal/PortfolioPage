<section id="hero" class="hero">
  <div class="hero__photo">
    <img
      [src]="data.profile.heroImage"
      [alt]="data.profile.firstName + ' ' + data.profile.lastName"
      fetchpriority="high"
    />
  </div>
  <div class="hero__accent"></div>
  <div class="hero__content">
    <app-liquid-glass-panel padding="lg" [translucencyLevel]="0">
      <h1 class="hero__title">
        <span class="hero__title-line">I'm</span>
        <span class="hero__title-name">{{ data.profile.firstName }} {{ data.profile.lastName }}</span>
      </h1>
      <p class="hero__subtitle">{{ data.profile.heroSubtitle }}</p>

      <!-- CV download: single button → splits into two on click -->
      <div class="hero__cv-wrapper" (click)="$event.stopPropagation()">
        @if (!cvExpanded()) {
          <app-liquid-glass-button
            class="hero__cv-single"
            label="Download CV"
            variant="solid"
            color="accent"
            (click)="toggleCv($event)"
          />
        } @else {
          <div class="hero__cv-split">
            <app-liquid-glass-button
              label="Operations Research CV"
              variant="solid"
              color="accent"
              [href]="cvLinks.orCv"
              target="_blank"
              (click)="collapseCv()"
            />
            <app-liquid-glass-button
              label="Software CV"
              variant="solid"
              color="accent"
              [href]="cvLinks.softwareCv"
              target="_blank"
              (click)="collapseCv()"
            />
          </div>
        }
      </div>

      <div class="hero__social">
        <app-liquid-glass-button
          label="LinkedIn"
          variant="glass"
          color="accent"
          href="https://www.linkedin.com/in/nicolas-lopval"
          target="_blank"
        />
      </div>
    </app-liquid-glass-panel>
  </div>
</section>
